const cursorDot = document.getElementById('cursor-dot'); const cursorRing = document.getElementById('cursor-ring'); const allowsMotion = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; if (allowsMotion && window.innerWidth >= 1024) { let mouseX = 0, mouseY = 0; let ringX = 0, ringY = 0; window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; cursorDot.style.transform = 'translate(' + mouseX + 'px, ' + mouseY + 'px)'; }); const animateCursor = () => { ringX += (mouseX - ringX) * 0.15; ringY += (mouseY - ringY) * 0.15; cursorRing.style.transform = 'translate(' + ringX + 'px, ' + ringY + 'px)'; requestAnimationFrame(animateCursor); }; requestAnimationFrame(animateCursor); document.querySelectorAll('a, button, .cursor-pointer').forEach(el => { el.addEventListener('mouseenter', () => { cursorDot.classList.add('active'); cursorRing.classList.add('active'); }); el.addEventListener('mouseleave', () => { cursorDot.classList.remove('active'); cursorRing.classList.remove('active'); }); }); } window.addEventListener('load', () => { const preloader = document.getElementById('preloader'); const logo = document.getElementById('preloader-logo'); const body = document.body; setTimeout(() => logo.classList.add('visible'), 100); setTimeout(() => { preloader.classList.add('loaded'); body.classList.remove('is-loading'); }, 800); }); const nav = document.getElementById('top-nav'); window.addEventListener('scroll', () => { if (window.scrollY > 50) { nav.classList.add('nav-scrolled'); } else { nav.classList.remove('nav-scrolled'); } }); const revealObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('is-visible'); }); }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }); document.querySelectorAll('.reveal-up').forEach(el => revealObserver.observe(el)); const masonryObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('is-visible'); }); }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' }); document.querySelectorAll('.masonry-item').forEach(el => masonryObserver.observe(el)); const images = Array.from(document.querySelectorAll('.masonry-item img')).map(img => img.src); let currentIndex = 0; document.querySelectorAll('.masonry-item').forEach((item, index) => { item.addEventListener('click', () => openLightbox(index)); }); function openLightbox(index) { currentIndex = index; document.getElementById('lightbox-img').src = images[currentIndex]; document.getElementById('lightbox').classList.add('open'); } function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.getElementById('lightbox-img').src = ''; } function navLightbox(dir) { currentIndex = (currentIndex + dir + images.length) % images.length; document.getElementById('lightbox-img').src = images[currentIndex]; } document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowLeft') navLightbox(-1); if (e.key === 'ArrowRight') navLightbox(1); }); function toggleMobileMenu() { var menu = document.getElementById('mobile-menu'); var bar1 = document.getElementById('menu-bar-1'); var bar2 = document.getElementById('menu-bar-2'); var bar3 = document.getElementById('menu-bar-3'); var isOpen = menu.style.transform === 'translateX(0%)' || menu.classList.contains('open'); if (isOpen) { menu.style.transform = 'translateX(100%)'; menu.style.opacity = '0'; menu.classList.remove('open'); document.body.style.overflow = ''; bar1.style.transform = ''; bar2.style.opacity = ''; bar3.style.transform = ''; } else { menu.style.transform = 'translateX(0%)'; menu.style.opacity = '1'; menu.classList.add('open'); document.body.style.overflow = 'hidden'; bar1.style.transform = 'rotate(45deg) translate(5px, 5px)'; bar2.style.opacity = '0'; bar3.style.transform = 'rotate(-45deg) translate(5px, -5px)'; } }
</script>
